
name: Build FANOGram APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Compiler FANOGram
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj:assembleAfatRelease

      - name: Récupérer APK
        uses: actions/upload-artifact@v4
        with:
          name: FANOGram-APK
          path: TMessagesProj/build/outputs/apk/afat/release/*.apk
          
